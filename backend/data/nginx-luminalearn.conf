# =========================================================================
# LuminaLearn Production Nginx Configuration
# Target: DigitalOcean Droplet (/var/www/luminalearn)
# =========================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name luminalearn.edu.lk www.luminalearn.edu.lk;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name luminalearn.edu.lk www.luminalearn.edu.lk;

    # SSL Certificates (managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/luminalearn.edu.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luminalearn.edu.lk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size for uploads (25MB to accommodate student submissions)
    client_max_body_size 25M;

    # 1. FRONTEND: Static React/Vite SPA Build
    root /var/www/luminalearn/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. PUBLIC MEDIA: Direct High-Performance Nginx Static Delivery
    # Serves public course banners, thumbnails, and user profile pictures
    location /media/ {
        alias /var/www/luminalearn/backend/storage/public/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # 3. STRICT SECURITY: Block ANY Direct Static Access to Private Storage
    location ^~ /storage/private/ {
        deny all;
        return 403;
    }

    # 4. API & PROTECTED FILES: Reverse Proxy to Node.js / Express API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket & Header Support for Live Chat and Streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Streaming Timeouts (allow long audio/video streaming & large PDFs)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off; # Enables immediate byte streaming
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
}
